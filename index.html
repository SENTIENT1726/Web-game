<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack the Lock</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-green: #238636;
            --accent-green-bright: #2ea043;
            --text-main: #c9d1d9;
            --glow-green: #3fb950;
            --glow-red: #f85149;
            --terminal-border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: var(--panel-bg);
            border: 2px solid var(--terminal-border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(63, 185, 80, 0.1);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .header {
            text-align: center;
            width: 100%;
        }

        .title {
            color: var(--glow-green);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(63, 185, 80, 0.4);
            margin-bottom: 5px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #8b949e;
            border-bottom: 1px solid var(--terminal-border);
            padding-bottom: 8px;
            width: 100%;
        }

        /* Lock Display Screen */
        .lock-display {
            background: #040d06;
            border: 2px solid var(--terminal-border);
            border-radius: 8px;
            width: 100%;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .digits-view {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 12px;
            color: var(--glow-green);
            text-shadow: 0 0 10px var(--glow-green);
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 12px; /* Offset spacing */
            transition: color 0.2s;
        }

        .dots-view {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            height: 20px;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #30363d;
            background: transparent;
            transition: all 0.2s;
        }

        .dot.filled {
            background: var(--glow-green);
            border-color: var(--glow-green);
            box-shadow: 0 0 6px var(--glow-green);
        }

        .dot.active {
            border-color: #8b949e;
        }

        .state-text {
            position: absolute;
            top: 8px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #8b949e;
            text-transform: uppercase;
        }

        /* Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        .key {
            background: #21262d;
            border: 1px solid var(--terminal-border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1.4rem;
            font-weight: bold;
            padding: 15px 0;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 0 #0d1117;
        }

        .key:active, .key.pressed {
            transform: translateY(3px);
            box-shadow: 0 0 0 transparent;
            background: #30363d;
            color: var(--glow-green);
            border-color: var(--glow-green);
        }

        .key:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Controls / Actions */
        .controls {
            width: 100%;
        }

        .btn {
            width: 100%;
            background: var(--accent-green);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-green-bright);
        }

        /* Scanline Overlay for Cyberpunk Vibe */
        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            border-radius: 8px;
            opacity: 0.6;
        }

        /* Feedback States */
        .error-glow {
            border-color: var(--glow-red) !important;
            box-shadow: inset 0 0 15px rgba(248, 81, 73, 0.4) !important;
        }

        .error-text {
            color: var(--glow-red) !important;
            text-shadow: 0 0 10px var(--glow-red) !important;
        }

        .success-glow {
            border-color: var(--glow-green) !important;
            box-shadow: inset 0 0 15px rgba(63, 185, 80, 0.4) !important;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="title">HACK THE LOCK</div>
            <div class="status-bar">
                <span>STAGE: <strong id="stage-num" style="color: white;">1</strong></span>
                <span>HIGHEST: <strong id="high-score" style="color: white;">0</strong></span>
            </div>
        </div>

        <div class="lock-display" id="lock-display">
            <div class="scanlines"></div>
            <div class="state-text" id="state-text">INITIALIZING</div>
            <div class="digits-view" id="digits-view">----</div>
            <div class="dots-view" id="dots-view"></div>
        </div>

        <div class="keypad">
            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key" style="visibility: hidden;"></button>
            <button class="key" data-value="0">0</button>
            <button class="key" style="visibility: hidden;"></button>
        </div>

        <div class="controls">
            <button class="btn" id="start-btn">START HACK</button>
        </div>
    </div>

    <script>
        // Game State Variables
        let sequence = [];
        let playerInput = [];
        let stage = 1;
        let highScore = 0;
        let isDisplaying = false;
        let isAcceptingInput = false;

        // DOM Elements
        const digitsView = document.getElementById('digits-view');
        const dotsView = document.getElementById('dots-view');
        const stateText = document.getElementById('state-text');
        const lockDisplay = document.getElementById('lock-display');
        const stageNumEl = document.getElementById('stage-num');
        const highScoreEl = document.getElementById('high-score');
        const startBtn = document.getElementById('start-btn');
        const keys = document.querySelectorAll('.key');

        // Sounds using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type = 'sine', duration = 0.1) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playBeep(num) {
            const freqs = [261, 293, 329, 349, 392, 440, 493, 523, 587, 659];
            playTone(freqs[num] || 400, 'sine', 0.08);
        }

        function playErrorSound() {
            playTone(150, 'sawtooth', 0.3);
        }

        function playSuccessSound() {
            playTone(523, 'triangle', 0.1);
            setTimeout(() => playTone(659, 'triangle', 0.15), 100);
            setTimeout(() => playTone(783, 'triangle', 0.2), 200);
        }

        // Initialize Game
        startBtn.addEventListener('click', startGame);

        function startGame() {
            stage = 1;
            sequence = [];
            stageNumEl.textContent = stage;
            startBtn.style.display = 'none';
            nextRound();
        }

        function nextRound() {
            playerInput = [];
            isAcceptingInput = false;
            
            // Add next digit
            sequence.push(Math.floor(Math.random() * 10));
            
            updateStageDisplay();
            showSequence();
        }

        function updateStageDisplay() {
            stageNumEl.textContent = stage;
            renderDots();
        }

        function renderDots() {
            dotsView.innerHTML = '';
            for (let i = 0; i < sequence.length; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i < playerInput.length) {
                    dot.classList.add('filled');
                } else if (i === playerInput.length && isAcceptingInput) {
                    dot.classList.add('active');
                }
                dotsView.appendChild(dot);
            }
        }

        // Display sequence logic
        async function showSequence() {
            isDisplaying = true;
            stateText.textContent = "INTERCEPTING...";
            stateText.style.color = "#8b949e";
            digitsView.textContent = "";
            digitsView.classList.remove('error-text');

            // Initial delay
            await sleep(600);

            // Flash digits sequentially
            for (let i = 0; i < sequence.length; i++) {
                digitsView.textContent = sequence[i];
                playBeep(sequence[i]);
                await sleep(500);
                digitsView.textContent = "";
                await sleep(150);
            }

            // Reveal phase finished
            stateText.textContent = "ENTER CODE";
            stateText.style.color = "var(--glow-green)";
            digitsView.textContent = "";
            isDisplaying = false;
            isAcceptingInput = true;
            renderDots();
        }

        // Handle Input
        keys.forEach(key => {
            key.addEventListener('click', () => {
                const val = key.getAttribute('data-value');
                if (val !== null) handleInput(parseInt(val));
            });
        });

        // Keyboard Support
        window.addEventListener('keydown', (e) => {
            if (!isAcceptingInput) return;
            if (e.key >= '0' && e.key <= '9') {
                const num = parseInt(e.key);
                // Visual key press effect
                const btn = Array.from(keys).find(k => k.getAttribute('data-value') == num);
                if (btn) {
                    btn.classList.add('pressed');
                    setTimeout(() => btn.classList.remove('pressed'), 100);
                }
                handleInput(num);
            }
        });

        function handleInput(digit) {
            if (!isAcceptingInput || isDisplaying) return;

            playBeep(digit);
            playerInput.push(digit);
            
            // Temporary flash digit as entered
            digitsView.textContent = digit;
            setTimeout(() => {
                if (isAcceptingInput) digitsView.textContent = "";
            }, 200);

            renderDots();

            // Check correctness of current entry
            const currentIdx = playerInput.length - 1;
            if (playerInput[currentIdx] !== sequence[currentIdx]) {
                handleFailure();
                return;
            }

            // Check if full sequence matched
            if (playerInput.length === sequence.length) {
                handleSuccess();
            }
        }

        async function handleSuccess() {
            isAcceptingInput = false;
            stateText.textContent = "ACCESS GRANTED";
            lockDisplay.classList.add('success-glow');
            playSuccessSound();

            await sleep(1000);
            
            lockDisplay.classList.remove('success-glow');
            stage++;
            if (stage - 1 > highScore) {
                highScore = stage - 1;
                highScoreEl.textContent = highScore;
            }
            
            nextRound();
        }

        async function handleFailure() {
            isAcceptingInput = false;
            playErrorSound();
            
            stateText.textContent = "LOCKOUT DETECTED";
            stateText.style.color = "var(--glow-red)";
            digitsView.textContent = "ERR";
            digitsView.classList.add('error-text');
            lockDisplay.classList.add('error-glow');

            await sleep(1500);

            lockDisplay.classList.remove('error-glow');
            digitsView.classList.remove('error-text');
            digitsView.textContent = "----";
            dotsView.innerHTML = "";
            stateText.textContent = "SYSTEM LOCKED";
            
            startBtn.style.display = 'block';
            startBtn.textContent = 'RETRY HACK';
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
