<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack the Lock</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-green: #238636;
            --accent-green-bright: #2ea043;
            --text-main: #c9d1d9;
            --glow-green: #3fb950;
            --glow-red: #f85149;
            --terminal-border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--terminal-border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(63, 185, 80, 0.1);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .screen.active {
            display: flex;
        }

        .header {
            text-align: center;
            width: 100%;
        }

        .title {
            color: var(--glow-green);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(63, 185, 80, 0.4);
            margin-bottom: 5px;
        }

        .form-group {
            width: 100%;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #8b949e;
            font-size: 0.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            background: #040d06;
            border: 1px solid var(--terminal-border);
            color: var(--glow-green);
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--glow-green);
            box-shadow: 0 0 5px rgba(63, 185, 80, 0.3);
        }

        .error-msg {
            color: var(--glow-red);
            font-size: 0.8rem;
            margin-top: 5px;
            height: 15px;
        }

        .btn {
            width: 100%;
            background: var(--accent-green);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: var(--accent-green-bright);
        }
        
        .btn:disabled {
            background: #30363d;
            color: #8b949e;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--terminal-border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: #21262d;
            border-color: #8b949e;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #8b949e;
            border-bottom: 1px solid var(--terminal-border);
            padding-bottom: 8px;
            width: 100%;
        }

        .lock-display {
            background: #040d06;
            border: 2px solid var(--terminal-border);
            border-radius: 8px;
            width: 100%;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .digits-view {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 12px;
            color: var(--glow-green);
            text-shadow: 0 0 10px var(--glow-green);
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 12px;
            transition: color 0.2s;
        }

        .dots-view {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            height: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #30363d;
            background: transparent;
            transition: all 0.2s;
        }

        .dot.filled {
            background: var(--glow-green);
            border-color: var(--glow-green);
            box-shadow: 0 0 6px var(--glow-green);
        }

        .dot.active {
            border-color: #8b949e;
        }

        .state-text {
            position: absolute;
            top: 8px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #8b949e;
            text-transform: uppercase;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        .key {
            background: #21262d;
            border: 1px solid var(--terminal-border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1.4rem;
            font-weight: bold;
            padding: 15px 0;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 0 #0d1117;
        }

        .key:active, .key.pressed {
            transform: translateY(3px);
            box-shadow: 0 0 0 transparent;
            background: #30363d;
            color: var(--glow-green);
            border-color: var(--glow-green);
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            border-radius: 8px;
            opacity: 0.6;
        }

        .error-glow { border-color: var(--glow-red) !important; box-shadow: inset 0 0 15px rgba(248, 81, 73, 0.4) !important; }
        .error-text { color: var(--glow-red) !important; text-shadow: 0 0 10px var(--glow-red) !important; }
        .success-glow { border-color: var(--glow-green) !important; box-shadow: inset 0 0 15px rgba(63, 185, 80, 0.4) !important; }

        .leaderboard-table-container {
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--terminal-border);
            border-radius: 6px;
            background: #0d1117;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .leaderboard-table th {
            background: #21262d;
            color: #8b949e;
            text-align: left;
            padding: 8px;
            position: sticky;
            top: 0;
        }

        .leaderboard-table td {
            padding: 8px;
            border-bottom: 1px solid #21262d;
        }

        .leaderboard-table tr:last-child td { border-bottom: none; }
        .rank-col { width: 40px; text-align: center; color: #8b949e; }
        .score-col { text-align: right; color: var(--glow-green); font-weight: bold; }
        
        #loading-indicator {
            color: var(--glow-green);
            font-size: 0.9rem;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="header">
            <div class="title">HACK THE LOCK</div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div id="auth-status" class="error-msg" style="color: #8b949e; text-align: center; margin-bottom: 10px;">Connecting to secure network...</div>
            
            <div class="form-group">
                <label for="player-name">OPERATIVE NAME</label>
                <input type="text" id="player-name" placeholder="Enter Alias" autocomplete="off" maxlength="15">
            </div>
            
            <div class="form-group">
                <label for="player-class">CLASS / UNIT</label>
                <input type="text" id="player-class" placeholder="e.g. Cybersec, Alpha-1" autocomplete="off" maxlength="15">
            </div>

            <div id="start-error" class="error-msg"></div>

            <button class="btn" id="init-btn" disabled>INITIALIZE SEQUENCE</button>
            <button class="btn btn-outline" id="view-board-btn">VIEW LEADERBOARD</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="status-bar">
                <span>STAGE: <strong id="stage-num" style="color: white;">1</strong></span>
                <span>TARGET: <strong id="player-display" style="color: white;"></strong></span>
            </div>

            <div class="lock-display" id="lock-display">
                <div class="scanlines"></div>
                <div class="state-text" id="state-text">INITIALIZING</div>
                <div class="digits-view" id="digits-view">----</div>
                <div class="dots-view" id="dots-view"></div>
            </div>

            <div class="keypad">
                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key" style="visibility: hidden;"></button>
                <button class="key" data-value="0">0</button>
                <button class="key" style="visibility: hidden;"></button>
            </div>

            <div class="controls" style="width: 100%;">
                <button class="btn" id="start-btn" style="display: none;">START HACK</button>
                <button class="btn btn-outline" id="abort-btn" style="display: none; margin-top: 10px;">ABORT & LEADERBOARD</button>
            </div>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="screen">
            <h3 style="color: var(--glow-green); margin-bottom: 5px;">TOP OPERATIVES</h3>
            
            <div id="loading-indicator" style="display: none;">FETCHING SECURE DATA...</div>

            <div class="leaderboard-table-container">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th class="rank-col">#</th>
                            <th>NAME</th>
                            <th>CLASS</th>
                            <th class="score-col">STAGE</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <button class="btn" id="back-menu-btn" style="margin-top: 10px;">RETURN TO MENU</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration & Initialization
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hack-the-lock-demo';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key",
            projectId: "demo-project"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;

        async function initAuth() {
            try {
                if (initialAuthToken) {
                    const userCredential = await signInWithCustomToken(auth, initialAuthToken);
                    currentUser = userCredential.user;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    currentUser = userCredential.user;
                }
                document.getElementById('auth-status').textContent = "Network Secured.";
                document.getElementById('auth-status').style.color = "var(--glow-green)";
                document.getElementById('init-btn').disabled = false;
                
                // Hide success message after a bit
                setTimeout(() => {
                    document.getElementById('auth-status').style.display = 'none';
                }, 2000);
            } catch (error) {
                console.error("Auth Error:", error);
                document.getElementById('auth-status').textContent = "Auth Failed. Offline Mode.";
                // Still allow play in offline mode
                document.getElementById('init-btn').disabled = false;
            }
        }

        initAuth();

        async function saveScore(playerName, playerClass, stageReached) {
            if (!currentUser) return;
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    // Only update if new stage is higher
                    const data = docSnap.data();
                    if (stageReached > data.stage) {
                        await setDoc(docRef, { 
                            name: playerName, 
                            class: playerClass, 
                            stage: stageReached,
                            timestamp: Date.now()
                        }, { merge: true });
                    }
                } else {
                    await setDoc(docRef, { 
                        name: playerName, 
                        class: playerClass, 
                        stage: stageReached,
                        timestamp: Date.now()
                    });
                }
            } catch (e) {
                console.error("Failed to save score:", e);
            }
        }

        async function loadLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            const loader = document.getElementById('loading-indicator');
            tbody.innerHTML = '';
            loader.style.display = 'block';

            if (!currentUser) {
                loader.textContent = "OFFLINE - UNABLE TO FETCH DATA";
                loader.style.color = "var(--glow-red)";
                return;
            }

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                const snapshot = await getDocs(colRef);
                
                let scores = [];
                snapshot.forEach(doc => scores.push(doc.data()));
                
                // Sort in memory (No complex queries rule)
                scores.sort((a, b) => b.stage - a.stage || a.timestamp - b.timestamp);
                
                loader.style.display = 'none';

                if (scores.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#8b949e;">No operatives found.</td></tr>`;
                    return;
                }

                // Render top 50
                const topScores = scores.slice(0, 50);
                topScores.forEach((score, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="rank-col">${index + 1}</td>
                        <td>${escapeHTML(score.name || 'Unknown')}</td>
                        <td>${escapeHTML(score.class || 'N/A')}</td>
                        <td class="score-col">${score.stage || 0}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (e) {
                console.error("Failed to load leaderboard:", e);
                loader.textContent = "ERROR FETCHING SECURE DATA";
                loader.style.color = "var(--glow-red)";
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        let sequence = [];
        let playerInput = [];
        let stage = 1;
        let isDisplaying = false;
        let isAcceptingInput = false;
        let currentOperativeName = "";
        let currentOperativeClass = "";

        // UI Element References
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            leaderboard: document.getElementById('leaderboard-screen')
        };
        
        const inputs = {
            name: document.getElementById('player-name'),
            cls: document.getElementById('player-class')
        };

        const els = {
            digits: document.getElementById('digits-view'),
            dots: document.getElementById('dots-view'),
            stateText: document.getElementById('state-text'),
            lockDisplay: document.getElementById('lock-display'),
            stageNum: document.getElementById('stage-num'),
            playerDisplay: document.getElementById('player-display'),
            startError: document.getElementById('start-error'),
            startBtn: document.getElementById('start-btn'),
            abortBtn: document.getElementById('abort-btn'),
            initBtn: document.getElementById('init-btn'),
            viewBoardBtn: document.getElementById('view-board-btn'),
            backMenuBtn: document.getElementByI
